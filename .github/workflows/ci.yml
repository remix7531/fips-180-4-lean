name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build Lean
        uses: leanprover/lean-action@v1
        with:
          build-args: "spec impl equiv tests"
          test: "false"
          lint: "false"

      - name: Check equivalence proofs
        run: |
          lake --wfail build equiv
          lake lint --linters=.all spec equiv.AxiomCheck

      - name: Run CAVP tests
        run: lake test -- --fast

      - name: Build HTML
        run: bash scripts/build-html.sh

      - name: Prepare Pages artifact
        # Serve the rendered spec at the site root.
        run: mv docs/FIPS-180-4.html docs/index.html

      - name: Upload Pages artifact
        id: upload
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
